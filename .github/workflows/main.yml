name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          echo "Preparing Rich Music Web Assets..."
          mkdir -p android_build/assets
          cp -r public/* android_build/assets/
          echo "Web assets ready."

      # Catatan: Agar Gradle bisa membungkus web ini menjadi APK, repository Anda 
      # harus menyertakan struktur proyek Android (build.gradle, gradlew, dll).
      # Jika menggunakan project murni web, gunakan tool pihak ketiga seperti PWABuilder.
      - name: Success Notification
        run: echo "Workflow executed successfully!"
